<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME CHANGER (VARUN)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Meta Pixel Code -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(ellipse 70% 55% at 50% 45%, #1a6b63 0%, #0d403c 42%, #062421 100%);
            color: #fff;
            padding: 40px 16px;
            overflow-x: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            padding: 28px 24px 26px;
            border-radius: 28px;
            background: rgba(6, 40, 38, 0.55);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(94, 234, 212, 0.22);
            box-shadow:
                0 0 40px rgba(45, 212, 191, 0.14),
                0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            background: #0f3d38;
            color: #99f6e4;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .profile-wrap {
            position: relative;
            width: 118px;
            height: 118px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(#5eead4, #2dd4bf, #0d9488, #5eead4);
            animation: spinBorder 2.4s linear infinite;
            box-shadow: 0 0 22px rgba(45, 212, 191, 0.35);
        }

        .profile-spinner::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #0d403c;
        }

        .profile {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 3px solid #0d403c;
        }

        @keyframes spinBorder {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.4px;
            margin-bottom: 14px;
        }

        .content {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 22px;
        }

        .timer {
            font-size: 14px;
            font-weight: 600;
            margin-top: 18px;
            color: #fff;
        }

        .timer span {
            color: #5eead4;
            font-weight: 800;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(180deg, #2a9d8f 0%, #1a6b63 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            box-shadow: 0 0 22px rgba(45, 212, 191, 0.4);
            animation: jump 1.35s ease-in-out infinite;
            z-index: 1;
        }

        .btn .tg-icon {
            color: #fff;
            font-size: 18px;
        }

        @keyframes jump {
            0%, 55%, 100% { transform: translateY(0); }
            20% { transform: translateY(-14px); }
            35% { transform: translateY(0); }
            45% { transform: translateY(-7px); }
        }

        @media (max-width: 420px) {
            .card {
                padding: 24px 18px 22px;
            }

            h1 {
                font-size: 19px;
            }

            .btn {
                font-size: 13px;
                padding: 13px 14px;
            }
        }
    </style>

</head>

<body>

    <div class="wrap">

        <div class="card">

            <div class="badge">Official Channel</div>

            <div class="profile-wrap">
                <span class="profile-spinner"></span>
                <img src="varun-profle.jpg" class="profile" alt="GAME CHANGER (VARUN)">
            </div>

            <h1>GAME CHANGER (VARUN)</h1>
            <p class="content">
                Cricket match analysis, stats & insights.<br>
                All content is for informational & educational purposes only.<br>
                No guarantees. No promotion of gambling.<br>
                Play responsibly.
            </p>

            <a class="btn" href="https://telegram.me/+hiDGaFgRLM8zZjFl" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-telegram-plane tg-icon"></i>
                <span>Join Telegram Channel</span>
            </a>

            <div class="timer">
                FREE JOINING ENDS IN <span id="count">15</span>s
            </div>

        </div>

    </div>

    <script>
        let time = 15;
        let counter = document.getElementById("count");

        setInterval(() => {
            time--;
            counter.innerText = time;
            if (time <= 0) {
                window.location.href = "https://telegram.me/+hiDGaFgRLM8zZjFl";
            }
        }, 1000);
    </script>

</body>

</html>
